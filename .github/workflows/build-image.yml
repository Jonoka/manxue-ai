name: Build manxue-ai image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SOURCE_REPOSITORY: w1196396546/manxue-ai
  SOURCE_COMMIT: 5da79674417dd0748682f09b7b7467efd1968ea8
  IMAGE_NAME: ghcr.io/jonoka/manxue-ai

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout pinned upstream source
        shell: bash
        run: |
          git clone --filter=blob:none "https://github.com/${SOURCE_REPOSITORY}.git" source
          git -C source checkout --detach "${SOURCE_COMMIT}"
          test "$(git -C source rev-parse HEAD)" = "${SOURCE_COMMIT}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local test image
        run: docker buildx build --platform linux/amd64 --load --tag manxue-ai:ci ./source/app

      - name: Run HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name manxue-ai-smoke \
            --publish 18765:8765 \
            --env ADMIN_TOKEN='ci-only-admin-token-123' \
            manxue-ai:ci
          cleanup() { docker rm --force manxue-ai-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18765/api/auth/status || true)
            if [ "$status" = 200 ]; then break; fi
            sleep 2
          done
          test "$status" = 200
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18765/)" = 200
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18765/admin)" = 200
          test "$(docker inspect --format '{{.State.Health.Status}}' manxue-ai-smoke)" = healthy

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable image
        run: |
          docker tag manxue-ai:ci "${IMAGE_NAME}:sha-${SOURCE_COMMIT}"
          docker tag manxue-ai:ci "${IMAGE_NAME}:run-${GITHUB_RUN_ID}"
          docker push "${IMAGE_NAME}:sha-${SOURCE_COMMIT}"
          docker push "${IMAGE_NAME}:run-${GITHUB_RUN_ID}"
          docker buildx imagetools inspect "${IMAGE_NAME}:sha-${SOURCE_COMMIT}"
